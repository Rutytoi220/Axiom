[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-axiom-agent"
version = "1.0.0"
description = "A local-first AI orchestration framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "rutytoi", email = "charlesbbm@outlook.fr"}
]
keywords = ["ai", "llm", "orchestration", "agents", "tools", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28.0",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "pyautogui>=0.9.53",
    "pillow>=10.1.0",
    "opencv-python>=4.8.0",
    "websockets>=12.0",
    "watchdog>=3.0.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "isort>=5.0",
]

[project.scripts]
axiom = "axiom.api.cli:run_cli"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=axiom --cov-report=html"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom*"]
