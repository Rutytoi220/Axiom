[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-core"
version = "1.0.0"
authors = [
  { name="AXIOM Contributors", email="admin@axiom.local" },
]
description = "A Local-First AI Operating System for Linux."
readme = "README.md"
requires-python = ">=3.10, <3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PySide6>=6.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.4.0",
    "faster-whisper>=1.0.0",
    "openwakeword>=0.4.0",
    "pyttsx3>=2.90",
    "litellm>=1.93.0",
    "pydantic>=2.0",
    "sounddevice>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "structlog>=24.0.0"
]

[project.scripts]
axiom = "axiom.gui.app:main"
axiomd = "main:daemon_entry_point"

[tool.setuptools.packages.find]
include = ["axiom*"]
