name: Test and Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 xvfb libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a uv run pytest
