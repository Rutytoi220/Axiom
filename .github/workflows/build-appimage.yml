name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v', e.g., v11.2.0

permissions:
  contents: write # Required for softprops/action-gh-release to upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # libfuse2 is required to run AppImages (like appimagetool) on Ubuntu 22.04+
          # python3-tk python3-dev are required for tkinter/mouseinfo compilation
          sudo apt-get install -y libfuse2 python3-tk python3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Build AppImage
        run: |
          chmod +x ./scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "*.AppImage"
          generate_release_notes: true
