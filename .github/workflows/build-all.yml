name: Build Cross-Platform AXIOM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller build
          pip install -r requirements.txt || echo "No requirements.txt found, skipping."
          pip install -e .
          
      - name: Install FPM (Linux Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Install create-dmg (macOS Only)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: PyInstaller Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: pyinstaller --name axiom --onefile axiom/api/cli.py
        
      - name: PyInstaller Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --name axiom --onefile axiom/api/cli.py --noupx

      - name: Package .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build_pkg/usr/bin
          cp dist/axiom build_pkg/usr/bin/
          chmod +x build_pkg/usr/bin/axiom
          
          # Create Post-Install script
          cat << 'EOF' > post_install.sh
          #!/bin/bash
          echo "AXIOM has been installed. Run 'axiom daemon install' to configure the background service."
          EOF
          chmod +x post_install.sh
          
          fpm -s dir -t deb -n axiom -v ${GITHUB_REF_NAME#v} --architecture amd64 --after-install post_install.sh -C build_pkg .
          fpm -s dir -t rpm -n axiom -v ${GITHUB_REF_NAME#v} --architecture x86_64 --after-install post_install.sh -C build_pkg .

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build_app/AXIOM.app/Contents/MacOS
          cp dist/axiom build_app/AXIOM.app/Contents/MacOS/
          chmod +x build_app/AXIOM.app/Contents/MacOS/axiom
          create-dmg --volname "AXIOM Installer" --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "AXIOM.app" 200 190 --hide-extension "AXIOM.app" --app-drop-link 600 185 "axiom_latest.dmg" build_app/

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: axiom_latest.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/axiom.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
